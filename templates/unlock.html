<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حَكَم | دخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:block">
  <form class="unlock card" id="f">
    <h1 style="color:var(--gold2)">⚖ حَكَم</h1>
    <p class="note">هذا الموقع محمي. أدخل رمز الدخول.</p>
    <input id="t" type="password" autocomplete="current-password" required>
    <button class="btn gold" style="width:100%">دخول</button>
    <p id="e" class="err"></p>
    <p class="note">الإصدار {{ version }}</p>
  </form>
  <script>
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      const r = await fetch("/unlock", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({token: document.getElementById("t").value})});
      if (r.ok) location.reload(); else document.getElementById("e").textContent = "رمز غير صحيح";
    };
  </script>
</body>
</html>
